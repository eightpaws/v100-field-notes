name: Measurement correction
description: A number on a card does not reproduce on your hardware
title: "[correction] V100-NN: what does not reproduce"
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for checking a number. Fill every field: without the command and the raw output the report cannot be verified, and the card stays as it is.
  - type: input
    id: card
    attributes:
      label: Card ID
      description: For example V100-16
      placeholder: V100-16
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and compute capability
      description: e.g. Tesla V100-SXM2 16 GB, sm_70
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Driver, engine and version
      description: driver 580.178.04, llama.cpp 79e2e74, Ollama 0.40.16
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: Paste the command line you ran, with all flags
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the card says, and what you got
      description: Both numbers, with units
    validations:
      required: true
  - type: textarea
    id: raw
    attributes:
      label: Raw output
      description: Paste the output or link to a file. A summary is not enough.
      render: text
    validations:
      required: true
  - type: input
    id: repeats
    attributes:
      label: Repeats
      description: How many runs, and the spread
      placeholder: single run
    validations:
      required: true
