name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cards, index and README are consistent
        run: python3 tools/check_index.py

      - name: No em dashes in cards
        run: |
          # Cards use a plain hyphen: an em dash is easy to confuse when copying.
          if grep -rl $'\u2014' results/ 2>/dev/null | head -5 | grep -q .; then
            echo "::warning::em dash found in cards"
          fi
          echo "checked"

      - name: No Cyrillic in published files
        run: |
          # The repository is English-only: Russian text lives outside it.
          if grep -rlP '[\x{0400}-\x{04FF}]{4}' --include='*.md' --include='*.json' . 2>/dev/null | grep -v '^./.git/' | head -5 | grep -q .; then
            echo "::error::Cyrillic text found in published files"
            grep -rlP '[\x{0400}-\x{04FF}]{4}' --include='*.md' --include='*.json' . | head -5
            exit 1
          fi
          echo "checked"
